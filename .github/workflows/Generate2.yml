name: Generate Raw and NoBG Zips

on:
  workflow_dispatch:
    inputs:
      prompts_list:
        description: 'Paste your full prompt list here (e.g., my_prompts = ["a", "b"])'
        required: true
        type: string
      zip_number:
        description: 'Enter the number for the ZIP file (e.g., 1, 2, 3)'
        required: true
        default: '1'
        type: string
      bg_models:
        description: 'Cutout model(s): one name, several comma-separated, or "all" (birefnet-general, birefnet-general-lite, isnet-general-use, u2net, silueta)'
        required: false
        default: 'birefnet-general'
        type: string
      clean_zips:
        description: 'Delete ALL old zips in images/ and remove/ before generating'
        required: false
        default: false
        type: boolean

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Cache AI cutout models
      uses: actions/cache@v4
      with:
        path: |
          ~/.rembg
          ~/.u2net
        key: rembg-models-v2
        restore-keys: rembg-models-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install System Requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable xvfb libgl1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install seleniumbase selenium-stealth opencv-python-headless numpy rembg onnxruntime pillow

    - name: Clean old zips (optional)
      if: ${{ github.event.inputs.clean_zips == 'true' }}
      run: |
        rm -fv images/*.zip remove/*.zip

    - name: Execute Script
      env:
        USER_PROMPTS: ${{ github.event.inputs.prompts_list }}
        ZIP_NUM: ${{ github.event.inputs.zip_number }}
        BG_MODELS: ${{ github.event.inputs.bg_models }}
      run: |
        mkdir -p images remove
        xvfb-run python main.py

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"

        git add -A images remove || echo "Nothing to stage"

        git commit -m "Batch ${{ github.event.inputs.zip_number }} (models: ${{ github.event.inputs.bg_models }})" || exit 0

        for i in {1..5}; do
          echo "Attempt $i to push..."
          git pull origin main --rebase
          if git push origin main; then
            echo "Push successful!"
            exit 0
          fi
          echo "Push failed due to conflict, retrying in 5 seconds..."
          sleep 5
        done

        echo "Failed to push after 5 attempts."
        exit 1
